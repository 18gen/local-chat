# The app as it runs on a server: only the proxy is reachable from outside.
#   cp .env.example .env    # then set the model
#   docker compose up --build

services:
  proxy:
    image: nginx:stable-alpine
    ports:
      - "${PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  frontend:
    build: ../frontend
    restart: unless-stopped

  backend:
    build: ../backend
    env_file: .env
    # Nothing is stored, so nothing needs to be writable.
    read_only: true
    restart: unless-stopped
