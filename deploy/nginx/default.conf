# /api goes straight to the backend, so patient data never passes through
# the Next.js server; everything else is the frontend.

server {
    listen 80;

    # A long conversation is sent whole with every message.
    client_max_body_size 16m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Replies stream: pass each piece on at once, and wait while the model
        # works through a queue.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
    }
}
